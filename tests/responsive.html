<!doctype html><html lang="es"><meta charset="utf-8"><title>Bloom & Brew · Auditoría móvil</title>
<style>body{margin:0;background:#d8e5d5;font:14px system-ui;color:#24564d}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:10px;border:1px solid #78917b;border-radius:8px;background:#fffdf2;color:inherit}iframe{display:block;border:0;margin:0 20px;background:#fff;box-shadow:0 4px 25px #24564d55}#result{padding:10px 20px;white-space:pre-wrap;position:absolute;left:880px;top:100px;max-width:600px}</style>
<header><b>Auditoría local · tamaño CSS, no emulación de Safari</b><button data-size="320,568">320 × 568</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><button data-size="844,390">844 × 390</button><button data-view="home">Mapa</button><button data-view="operations">Turno</button><button data-view="shop">Mejoras</button><button data-view="goals">Objetivos</button><button data-view="reports">Negocio</button><button id="room">Panel cafetería</button><button id="bottom">Final del panel</button><button id="inspect">Medir interfaz</button></header>
<header><button id="light">Modo ligero</button><button id="three">Modo 3D</button><button data-focus="golf">Golf</button><button data-focus="pool">Piscina</button><button data-focus="dance">Baile</button></header>
<iframe title="Juego en tamaño móvil" id="phone" src="../?demo=leisure" width="390" height="844"></iframe><pre id="result" role="status"></pre>
<script>
const phone=document.getElementById('phone');
document.getElementById('light').onclick=()=>phone.src='../?demo=leisure&renderer=2d';document.getElementById('three').onclick=()=>phone.src='../?demo=leisure';document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>phone.contentDocument.querySelector('[data-focus="'+b.dataset.focus+'"]').click());
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');phone.width=w;phone.height=h;});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>phone.contentDocument.querySelector('.nav-btn[data-view="'+b.dataset.view+'"]').click());
document.getElementById('room').onclick=()=>phone.contentDocument.getElementById('cafe-zone').click();
document.getElementById('bottom').onclick=()=>{const p=phone.contentDocument.getElementById('zone-panel');p.scrollTop=p.scrollHeight;};
document.getElementById('inspect').onclick=()=>{const d=phone.contentDocument,w=Number(phone.width),h=Number(phone.height),visible=e=>{const r=e.getBoundingClientRect(),s=phone.contentWindow.getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&!e.closest('[hidden]');},outside=[...d.querySelectorAll('.nav button,.map-controls button,#menu-close,#zone-close,.top')].filter(visible).map(e=>({id:e.id||e.textContent.trim(),r:e.getBoundingClientRect()})).filter(v=>v.r.left<-.5||v.r.top<-.5||v.r.right>w+.5||v.r.bottom>h+.5).map(v=>v.id);document.getElementById('result').textContent=JSON.stringify({viewport:[w,h],horizontalOverflow:d.documentElement.scrollWidth>w,controlsOutside:outside,renderer:d.getElementById('scene').dataset.renderer,buttons:[...d.querySelectorAll('button')].filter(visible).length},null,2);};
</script></html>
